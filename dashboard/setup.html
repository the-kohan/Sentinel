<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sentinel Setup</title>
  <link rel="stylesheet" href="/_next/static/chunks/01054d98c413d81d.css" data-precedence="next" />
</head>
<body class="bg-background text-foreground antialiased">
<div class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-2xl space-y-6">
    <div class="flex items-center gap-3">
      <h1 class="text-2xl font-bold">Setup</h1>
      <span id="status-badge" class="px-2 py-0.5 rounded-full text-xs font-medium border">Checking...</span>
    </div>

    <div id="stats-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>

    <div class="rounded-xl border bg-[var(--surface)] p-5">
      <h2 class="text-lg font-semibold mb-1">Telegram Notifications</h2>
      <p class="text-sm text-[var(--muted)] mb-4">
        Connect a Telegram bot so Sentinel can send alerts to your phone.
      </p>
      <div id="telegram-status"></div>
      <div id="telegram-form" class="space-y-3" style="display:none">
        <input id="tg-token" type="password" placeholder="Bot Token (from @BotFather)"
          class="w-full rounded-lg px-3 py-2 text-sm border bg-[var(--surface-2)] text-[var(--fg)] placeholder:text-[var(--muted)] focus:outline-none focus:ring-2 focus:ring-ring" />
        <input id="tg-chat" type="text" placeholder="Chat ID (your Telegram user ID)"
          class="w-full rounded-lg px-3 py-2 text-sm border bg-[var(--surface-2)] text-[var(--fg)] placeholder:text-[var(--muted)] focus:outline-none focus:ring-2 focus:ring-ring" />
        <div class="flex gap-2">
          <button id="tg-save" class="flex-1 rounded-lg px-4 py-2 text-sm font-medium bg-ring text-ring-foreground hover:bg-ring/80 disabled:opacity-40" disabled>Save</button>
          <a href="https://t.me/BotFather" target="_blank" class="rounded-lg px-4 py-2 text-sm text-[var(--muted)] hover:text-[var(--fg)]">Get Bot Token</a>
        </div>
      </div>
    </div>

    <div id="checklist" class="rounded-xl border p-4" style="display:none"></div>

    <div class="rounded-xl border bg-[var(--surface)] p-4 text-sm text-[var(--muted)]">
      <p class="mb-2"><span class="font-medium text-[var(--fg)]">Sentinel</span> watches your Docker mesh and host network.</p>
      <p class="text-xs" id="stack-info">Loading...</p>
    </div>
  </div>
</div>

<script>
const API = '/api';

async function setupStatus() {
  const res = await fetch(API + '/setup/status');
  const s = await res.json();
  const badge = document.getElementById('status-badge');
  badge.textContent = s.initialized ? 'All configured' : 'Needs setup';
  badge.className = 'px-2 py-0.5 rounded-full text-xs font-medium border ' +
    (s.initialized ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border-amber-500/20');

  const grid = document.getElementById('stats-grid');
  const items = [
    { label: 'Events', value: s.event_count, ok: !s.issues.includes('no_events'), issue: 'no_events' },
    { label: 'Topology', value: s.topology_count, ok: !s.issues.includes('no_topology'), issue: 'no_topology' },
    { label: 'Allowlist', value: s.allowlist_count, ok: !s.issues.includes('empty_allowlist'), issue: 'empty_allowlist' },
    { label: 'Open Incidents', value: s.open_incidents, ok: true, issue: null },
  ];
  grid.innerHTML = items.map(i => `
    <div class="rounded-xl border bg-[var(--surface)] p-4">
      <div class="text-xs text-[var(--muted)] uppercase tracking-wide">${i.label}</div>
      <div class="text-lg font-semibold mt-1">${i.value}</div>
      <div class="text-xs mt-1 ${i.ok ? 'text-emerald-400' : 'text-rose-400'}">${i.ok ? (i.value > 0 ? 'Active' : 'Ready') : 'Needs attention'}</div>
    </div>`).join('');

  // Telegram
  const tgStatus = document.getElementById('telegram-status');
  const tgForm = document.getElementById('telegram-form');
  if (s.telegram_configured) {
    tgStatus.innerHTML = '<div class="flex items-center gap-2 text-sm text-emerald-400">\u2713 Telegram bot configured</div>';
  } else {
    tgForm.style.display = 'block';
    document.getElementById('tg-save').onclick = async () => {
      const btn = document.getElementById('tg-save');
      btn.disabled = true; btn.textContent = 'Saving...';
      const token = document.getElementById('tg-token').value;
      const chat = document.getElementById('tg-chat').value;
      const res = await fetch(API + '/setup/telegram', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, chat_id: chat })
      });
      const data = await res.json();
      if (data.status === 'configured') {
        btn.textContent = 'Saved!';
        setTimeout(() => { location.reload(); }, 1500);
      } else {
        btn.disabled = false; btn.textContent = 'Save';
        alert('Error: ' + (data.message || 'Failed to save'));
      }
    };
    document.getElementById('tg-token').addEventListener('input', () => {
      document.getElementById('tg-save').disabled = !(document.getElementById('tg-token').value && document.getElementById('tg-chat').value);
    });
    document.getElementById('tg-chat').addEventListener('input', () => {
      document.getElementById('tg-save').disabled = !(document.getElementById('tg-token').value && document.getElementById('tg-chat').value);
    });
  }

  // Checklist
  if (s.issues.length > 0) {
    const cl = document.getElementById('checklist');
    cl.style.display = 'block';
    cl.className = 'rounded-xl border bg-amber-500/5 p-4';
    cl.innerHTML = '<h3 class="text-sm font-semibold text-amber-400 mb-2">Setup Checklist</h3>' +
      s.issues.map(i => {
        const labels = { no_events: 'No network events collected yet', no_topology: 'No topology snapshots', empty_allowlist: 'Allowlist is empty' };
        return `<div class="flex items-center gap-2 text-sm text-[var(--muted)]"><span class="text-rose-400">\u25CF</span>${labels[i] || i}</div>`;
      }).join('');
  }

  document.getElementById('stack-info').textContent =
    `Current stack: ${s.allowlist_count} known services, ${s.event_count} events captured, ${s.topology_count} topology snapshots.`;
}

setupStatus().catch(e => console.error(e));
</script>
</body>
</html>
